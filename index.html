<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >
    <title>Fav Songs Playlist</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="player">

        <div class="song-info">
            <div class="label">NOW PLAYING</div>
            <h1 id="songTitle">Song 1</h1>
        </div>

        <div class="progress-area">
            <input
                type="range"
                id="progress"
                min="0"
                max="100"
                value="0"
                step="0.1"
            >

            <div class="time">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="controls">
            <button id="prevBtn" aria-label="Previous song">
                ‹‹
            </button>

            <button id="playBtn" class="play-button" aria-label="Play">
                ▶
            </button>

            <button id="nextBtn" aria-label="Next song">
                ››
            </button>
        </div>

        <p class="suggestion">
            For song suggestions email me at
            <a href="mailto:aryanpandya2310@gmail.com">
                aryanpandya2310@gmail.com
            </a>
        </p>

    </main>

    <audio id="audio" preload="metadata"></audio>

    <script src="script.js"></script>
</body>
</html>
